<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>CarWash Admin — 영업 리모컨</title>
    <meta name="theme-color" content="#5a58e9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CarWash Remote" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#5a58e9',
              'background-light': '#f6f6f8',
              'background-dark': '#111121',
              success: '#00D68F',
              danger: '#FF3D71',
              warning: '#FFB11B',
              'orange-accent': '#FF7043',
            },
            fontFamily: {
              display: ['Inter', 'sans-serif'],
            },
            borderRadius: { DEFAULT: '0.25rem', lg: '0.5rem', xl: '0.75rem', full: '9999px' },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        min-height: max(884px, 100dvh);
      }
      .huge-toggle-shadow {
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.1),
          0 8px 10px -6px rgba(0, 0, 0, 0.1);
      }
      /* 캡처처럼 바깥은 어두운 배경 + 도트 */
      .remote-page-bg {
        background-color: #111121;
        background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      /* iOS safe-area 대응 */
      .safe-top {
        padding-top: env(safe-area-inset-top);
      }
      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .toast {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(16px + env(safe-area-inset-bottom));
        z-index: 9999;
        max-width: min(520px, calc(100vw - 32px));
      }
      .toast-hidden {
        opacity: 0;
        pointer-events: none;
        transform: translateX(-50%) translateY(10px);
      }
      .toast-visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body class="remote-page-bg font-display overscroll-none">
    <div class="flex flex-col min-h-screen max-w-md mx-auto bg-white dark:bg-slate-950 shadow-2xl relative overflow-hidden text-slate-900 dark:text-slate-100 safe-top safe-bottom">
      <div class="absolute top-0 left-0 right-0 h-1 bg-primary z-10"></div>

      <!-- Header -->
      <header class="flex items-center justify-between px-6 py-6 bg-white dark:bg-slate-950 border-b border-slate-100 dark:border-slate-800">
        <h1 class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-white pr-2">Sparkle Shine Auto Spa</h1>
        <a
          href="dashboard.html"
          class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors shrink-0"
          aria-label="대시보드로"
        >
          <span class="material-symbols-outlined text-slate-600 dark:text-slate-400 text-3xl">settings</span>
        </a>
      </header>

      <!-- Main: Remote Control -->
      <main class="flex-1 p-6 space-y-8 pb-32">
        <!-- Store Selector + Status -->
        <section class="space-y-3">
          <div class="flex items-end justify-between gap-3">
            <div class="min-w-0">
              <h2 class="text-lg font-bold text-slate-500 dark:text-slate-400 ml-1">지점 선택</h2>
              <p class="text-xs text-slate-400 dark:text-slate-500 ml-1 mt-1">중안 목업 · 변경 시 API로 저장되는 형태</p>
            </div>
            <div class="text-right shrink-0">
              <p class="text-[11px] text-slate-400 dark:text-slate-500 font-semibold">마지막 저장</p>
              <p class="text-xs font-extrabold text-slate-700 dark:text-slate-200" id="last-saved">—</p>
            </div>
          </div>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">storefront</span>
            <select
              id="store-select"
              class="w-full h-14 pl-12 pr-10 bg-slate-100 dark:bg-slate-900 border-none rounded-2xl focus:ring-4 focus:ring-primary/30 text-base font-bold"
            >
              <option value="store_gangnam" selected>강남점 · Sparkle Shine Auto Spa</option>
              <option value="store_yeoksam">역삼점 · BubbleSign Auto</option>
              <option value="store_jamsil">잠실점 · Aqua Shine Pro</option>
            </select>
            <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
          </div>
        </section>

        <section class="space-y-4">
          <h2 class="text-lg font-bold text-slate-500 dark:text-slate-400 ml-1">영업 상태</h2>
          <div class="grid grid-cols-2 gap-4 h-32">
            <label class="relative flex cursor-pointer group">
              <input checked class="peer sr-only" name="status" type="radio" value="open" />
              <div
                class="w-full h-full flex flex-col items-center justify-center rounded-2xl border-4 border-transparent bg-slate-100 dark:bg-slate-900 peer-checked:bg-success peer-checked:text-white transition-all duration-200 huge-toggle-shadow"
              >
                <span class="material-symbols-outlined text-4xl mb-1">check_circle</span>
                <span class="text-xl font-black">Open</span>
              </div>
            </label>
            <label class="relative flex cursor-pointer group">
              <input class="peer sr-only" name="status" type="radio" value="closed" />
              <div
                class="w-full h-full flex flex-col items-center justify-center rounded-2xl border-4 border-transparent bg-slate-100 dark:bg-slate-900 peer-checked:bg-danger peer-checked:text-white transition-all duration-200 huge-toggle-shadow"
              >
                <span class="material-symbols-outlined text-4xl mb-1">cancel</span>
                <span class="text-xl font-black">Closed</span>
              </div>
            </label>
          </div>
        </section>

        <section class="space-y-4">
          <h2 class="text-lg font-bold text-slate-500 dark:text-slate-400 ml-1">겨울철 모드</h2>
          <div class="grid grid-cols-2 gap-4 h-32">
            <label class="relative flex cursor-pointer group">
              <input checked class="peer sr-only" name="winter" type="radio" value="hot" />
              <div
                class="w-full h-full flex flex-col items-center justify-center rounded-2xl border-4 border-transparent bg-slate-100 dark:bg-slate-900 peer-checked:bg-primary peer-checked:text-white transition-all duration-200 huge-toggle-shadow"
              >
                <span class="material-symbols-outlined text-4xl mb-1">hot_tub</span>
                <span class="text-base font-black leading-tight text-center">Hot Water<br />ON</span>
              </div>
            </label>
            <label class="relative flex cursor-pointer group">
              <input class="peer sr-only" name="winter" type="radio" value="frozen" />
              <div
                class="w-full h-full flex flex-col items-center justify-center rounded-2xl border-4 border-transparent bg-slate-100 dark:bg-slate-900 peer-checked:bg-danger peer-checked:text-white transition-all duration-200 huge-toggle-shadow"
              >
                <span class="material-symbols-outlined text-4xl mb-1">ac_unit</span>
                <span class="text-base font-black leading-tight text-center">Frozen<br />Alert</span>
              </div>
            </label>
          </div>
        </section>

        <section class="space-y-4">
          <h2 class="text-lg font-bold text-slate-500 dark:text-slate-400 ml-1">혼잡도 설정</h2>
          <div class="grid grid-cols-3 gap-3 h-40">
            <label class="relative flex cursor-pointer group">
              <input checked class="peer sr-only" name="traffic" type="radio" value="clear" />
              <div
                class="w-full h-full flex flex-col items-center justify-center rounded-2xl border-4 border-transparent bg-slate-100 dark:bg-slate-900 peer-checked:bg-success peer-checked:text-white transition-all duration-200 huge-toggle-shadow"
              >
                <span class="material-symbols-outlined text-3xl mb-2">speed</span>
                <span class="text-lg font-black">Clear</span>
              </div>
            </label>
            <label class="relative flex cursor-pointer group">
              <input class="peer sr-only" name="traffic" type="radio" value="normal" />
              <div
                class="w-full h-full flex flex-col items-center justify-center rounded-2xl border-4 border-transparent bg-slate-100 dark:bg-slate-900 peer-checked:bg-warning peer-checked:text-white transition-all duration-200 huge-toggle-shadow"
              >
                <span class="material-symbols-outlined text-3xl mb-2">traffic</span>
                <span class="text-lg font-black">Normal</span>
              </div>
            </label>
            <label class="relative flex cursor-pointer group">
              <input class="peer sr-only" name="traffic" type="radio" value="busy" />
              <div
                class="w-full h-full flex flex-col items-center justify-center rounded-2xl border-4 border-transparent bg-slate-100 dark:bg-slate-900 peer-checked:bg-orange-accent peer-checked:text-white transition-all duration-200 huge-toggle-shadow"
              >
                <span class="material-symbols-outlined text-3xl mb-2">grid_view</span>
                <span class="text-lg font-black">Busy</span>
              </div>
            </label>
          </div>
        </section>

        <section class="space-y-4">
          <h2 class="text-lg font-bold text-slate-500 dark:text-slate-400 ml-1">공지사항 작성</h2>
          <div class="relative">
            <input
              id="announcement"
              class="w-full h-16 pl-6 pr-[5.5rem] bg-slate-100 dark:bg-slate-900 border-none rounded-2xl focus:ring-4 focus:ring-primary/30 text-lg font-medium placeholder:text-slate-400"
              placeholder="예: 오늘 영하 10도로 인해 조기 마감합니다"
              type="text"
            />
            <button
              type="button"
              id="save-announcement"
              class="absolute right-3 top-3 bottom-3 bg-primary text-white px-4 rounded-xl font-bold hover:bg-primary/90 transition-colors"
            >
              저장
            </button>
          </div>
        </section>

        <!-- API Payload Preview (for backend integration) -->
        <section class="space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-bold text-slate-500 dark:text-slate-400 ml-1">API Payload 미리보기</h2>
            <button
              type="button"
              id="copy-payload"
              class="text-sm font-extrabold text-primary hover:underline"
              aria-label="payload 복사"
            >
              복사
            </button>
          </div>
          <pre
            id="payload-preview"
            class="w-full bg-slate-100 dark:bg-slate-900 rounded-2xl p-4 text-[12px] leading-5 overflow-auto border border-slate-200/60 dark:border-slate-800"
          >{}</pre>
          <p class="text-xs text-slate-400 dark:text-slate-500 ml-1">
            실제 연동 시에는 아래 JSON을 그대로 서버에 <span class="font-bold">PATCH</span>로 보내는 형태로 연결합니다.
          </p>
        </section>
      </main>

      <footer class="absolute bottom-0 left-0 right-0 p-6 bg-white dark:bg-slate-950 border-t border-slate-100 dark:border-slate-800 safe-bottom">
        <a
          href="index.html"
          class="w-full h-14 flex items-center justify-center gap-2 rounded-2xl border-2 border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 font-bold hover:bg-slate-50 dark:hover:bg-slate-900 transition-colors"
        >
          <span class="material-symbols-outlined">logout</span>
          <span>로그아웃</span>
        </a>
      </footer>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast toast-hidden transition-all duration-200">
      <div class="bg-slate-900/95 text-white rounded-2xl px-4 py-3 shadow-xl flex items-center gap-2">
        <span class="material-symbols-outlined text-[20px]" id="toast-icon">check_circle</span>
        <div class="min-w-0">
          <p class="text-sm font-extrabold leading-5" id="toast-title">저장됨</p>
          <p class="text-xs text-white/75 truncate" id="toast-subtitle">변경 사항이 반영되었습니다.</p>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

        const storeSelect = document.getElementById('store-select');
        const lastSavedEl = document.getElementById('last-saved');
        const announcementInput = document.getElementById('announcement');
        const saveAnnouncementBtn = document.getElementById('save-announcement');

        async function initRemote() {
          const { data: { session } } = await supabaseClient.auth.getSession();
          if (!session) { window.location.href = 'index.html'; return; }

          const { data: shops } = await supabaseClient
            .from('shops')
            .select('id, name')
            .eq('owner_id', session.user.id);

          if (shops && shops.length > 0) {
            storeSelect.innerHTML = shops.map(shop => 
              `<option value="${shop.id}">${shop.name}</option>`
            ).join('');
            loadShopData(shops[0].id);
          }
        }

        async function loadShopData(shopId) {
          const { data: shop } = await supabaseClient.from('shops').select('*').eq('id', shopId).single();
          if (shop) {
            // 영업 상태 반영
            const statusVal = (shop.op_status === '영업중') ? 'open' : 'closed';
            const stNode = document.querySelector(`input[name="status"][value="${statusVal}"]`);
            if (stNode) stNode.checked = true;

            // 겨울철 모드 반영
            const winterVal = shop.has_hot_water ? 'hot' : 'frozen';
            const wtNode = document.querySelector(`input[name="winter"][value="${winterVal}"]`);
            if (wtNode) wtNode.checked = true;

            // 혼잡도 반영
            if (shop.congestion) {
              const trNode = document.querySelector(`input[name="traffic"][value="${shop.congestion}"]`);
              if (trNode) trNode.checked = true;
            }

            // [핵심] 공지사항 불러오기
            if (announcementInput) {
              announcementInput.value = shop.announcement || '';
            }
            updateLastSaved();
          }
        }

        async function updateShopStatus(column, value) {
          const shopId = storeSelect.value;
          if (!shopId) return;
          
          const updateData = {};
          if (column === 'status') updateData.op_status = (value === 'open') ? '영업중' : '영업종료';
          else if (column === 'winter') updateData.has_hot_water = (value === 'hot');
          else if (column === 'traffic') updateData.congestion = value;
          else if (column === 'announcement') updateData.announcement = value;

          const { error } = await supabaseClient.from('shops').update(updateData).eq('id', shopId);

          if (!error) {
            showToast({ title: '저장됨', subtitle: '변경 사항이 반영되었습니다.' });
            updateLastSaved();
          } else {
            console.error("저장 에러:", error);
            showToast({ title: '오류', subtitle: '저장 실패', icon: 'error' });
          }
        }

        // [이벤트 리스너 영역]
        storeSelect.addEventListener('change', (e) => loadShopData(e.target.value));

        ['status', 'winter', 'traffic'].forEach(name => {
          document.querySelectorAll(`input[name="${name}"]`).forEach(el => {
            el.addEventListener('change', (e) => updateShopStatus(name, e.target.value));
          });
        });

        // [핵심] 공지사항 저장 버튼 리스너
        if (saveAnnouncementBtn) {
          saveAnnouncementBtn.onclick = function() {
            const text = announcementInput.value.trim();
            updateShopStatus('announcement', text);
          };
        }

        function updateLastSaved() { if (lastSavedEl) lastSavedEl.textContent = new Date().toLocaleTimeString(); }

        function showToast(opts) {
          const toast = document.getElementById('toast');
          document.getElementById('toast-title').textContent = opts.title;
          document.getElementById('toast-subtitle').textContent = opts.subtitle;
          if (opts.icon) document.getElementById('toast-icon').textContent = opts.icon;
          toast.classList.replace('toast-hidden', 'toast-visible');
          setTimeout(() => toast.classList.replace('toast-visible', 'toast-hidden'), 1500);
        }

        initRemote();
      })();
    </script>
  </body>
</html>
