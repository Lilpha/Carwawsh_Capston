<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>CarWash Admin — 로그인</title>
    <meta name="theme-color" content="#5a58e9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CarWash Admin" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#5a58e9',
              'background-light': '#f6f6f8',
              'background-dark': '#111121',
            },
            fontFamily: {
              display: ['Inter', 'sans-serif'],
            },
            borderRadius: { DEFAULT: '0.25rem', lg: '0.5rem', xl: '0.75rem', full: '9999px' },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-[440px] bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
      <div class="flex flex-col items-center pt-10 pb-8 px-6">
        <div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center mb-6 shadow-lg shadow-primary/20">
          <span class="material-symbols-outlined text-white text-4xl">local_car_wash</span>
        </div>
        <h1 class="text-slate-900 dark:text-slate-100 text-3xl font-bold tracking-tight">CarWash Admin</h1>
        <p class="text-slate-500 dark:text-slate-400 mt-2 text-sm">관리자 계정으로 로그인하세요</p>
      </div>

      <form class="px-8 pb-10 space-y-6" id="login-form" action="#" method="post">
        <div class="flex flex-col gap-2">
          <label class="text-slate-700 dark:text-slate-300 text-base font-semibold" for="user-id">사용자 아이디</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-slate-400 text-xl">person</span>
            </div>
            <input
              id="user-id"
              class="w-full h-14 pl-12 pr-4 rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 text-lg focus:border-primary focus:ring-0 transition-colors placeholder:text-slate-400"
              placeholder="아이디를 입력하세요"
              type="text"
              autocomplete="username"
            />
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-slate-700 dark:text-slate-300 text-base font-semibold" for="pin">PIN 번호</label>
          <div class="flex items-stretch">
            <div class="relative flex-1">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <span class="material-symbols-outlined text-slate-400 text-xl">lock</span>
              </div>
              <input
                id="pin"
                class="w-full h-14 pl-12 pr-4 rounded-lg rounded-r-none border-2 border-r-0 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 text-lg focus:border-primary focus:ring-0 transition-colors placeholder:text-slate-400"
                inputmode="numeric"
                pattern="[0-9]*"
                placeholder="숫자 4-6자리 입력"
                type="password"
                autocomplete="current-password"
              />
            </div>
            <button
              type="button"
              id="toggle-pin"
              class="flex items-center justify-center px-4 rounded-r-lg border-2 border-l-0 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-400 hover:text-primary transition-colors"
              aria-label="PIN 표시 전환"
            >
              <span class="material-symbols-outlined" id="toggle-pin-icon">visibility</span>
            </button>
          </div>
        </div>

        <div class="pt-4">
          <button
            type="submit"
            class="w-full h-16 bg-primary hover:bg-primary/90 text-white text-xl font-bold rounded-lg shadow-lg shadow-primary/25 flex items-center justify-center gap-2 transition-transform active:scale-[0.98]"
          >
            <span>로그인</span>
            <span class="material-symbols-outlined">login</span>
          </button>
        </div>

        <div class="flex items-center justify-between pt-4 border-t border-slate-100 dark:border-slate-800">
          <button type="button" class="text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-primary">
            아이디 찾기
          </button>
          <button type="button" class="text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-primary">
            PIN 초기화
          </button>
        </div>
      </form>
    </div>

    <div class="fixed top-0 left-0 w-full h-1 bg-primary"></div>
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 text-slate-400 text-xs text-center pointer-events-none">
      © 2024 CarWash Admin System. All rights reserved.
    </div>

    <script>
      (function () {
        /**
         * 1. Supabase 클라이언트 초기화
         * 프로젝트 고유 URL과 공개 키(Anon Key)를 사용하여 DB와 연결할 엔진을 생성합니다.
         */
        console.log("CONFIG 로드 확인:", typeof CONFIG !== 'undefined' ? "성공" : "실패");
        console.log("URL:", CONFIG.SUPABASE_URL);
        const supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        
        // HTML 요소 선택 (ID 기반)
        const pinInput = document.getElementById('pin');           // PIN 입력창
        const toggleBtn = document.getElementById('toggle-pin');    // 비밀번호 표시/숨김 버튼
        const icon = document.getElementById('toggle-pin-icon');    // 눈 모양 아이콘

        /**
         * 2. PIN 번호 표시/숨김 토글 로직
         * 눈 모양 아이콘을 클릭하면 input 타입을 password <-> text로 전환합니다.
         */
        if (toggleBtn && pinInput && icon) {
          toggleBtn.addEventListener('click', function () {
            const isPassword = pinInput.type === 'password';
            // 타입 변경을 통해 텍스트 노출 여부 결정
            pinInput.type = isPassword ? 'text' : 'password';
            // Material Symbol 아이콘 변경 (visibility <-> visibility_off)
            icon.textContent = isPassword ? 'visibility_off' : 'visibility';
          });
        }

        /**
         * 3. 로그인 폼 제출 처리
         * 폼이 제출될 때 Supabase Auth를 통해 실제 사장님 계정인지 확인합니다.
         */
        const form = document.getElementById('login-form');
        if (form) {
          form.addEventListener('submit', async function (e) {
            e.preventDefault(); // 폼 제출 시 페이지가 새로고침되는 것을 방지
            
            // 입력값 가져오기 (양 끝 공백 제거)
            const email = document.getElementById('user-id').value.trim();
            const password = pinInput.value;

            // 로그인 버튼 상태 제어 (UX 개선)
            const submitBtn = form.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;

            // 버튼 비활성화 및 로딩 애니메이션 추가 (중복 클릭 방지)
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>인증 중...</span><span class="material-symbols-outlined animate-spin">sync</span>';

            try {
              /**
               * Supabase 실제 인증 호출
               * 사장님의 이메일과 비밀번호(PIN)를 서버로 전송하여 세션을 생성합니다.
               */
              const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
              });

              // 서버에서 에러를 반환한 경우 catch 블록으로 던짐
              if (error) throw error;

              /**
               * 4. 인증 성공
               * 세션이 성공적으로 생성되면 사장님 전용 대시보드로 페이지를 이동시킵니다.
               */
              console.log('로그인 성공 유저:', data.user.email);
              window.location.href = 'dashboard.html';

            } catch (error) {
              /**
               * 5. 인증 실패 또는 네트워크 에러 처리
               * 사용자에게 에러 원인을 알리고, 버튼을 다시 활성화 상태로 되돌립니다.
               */
              alert('로그인 실패: ' + error.message);
              submitBtn.disabled = false;
              submitBtn.innerHTML = originalText;
            }
          });
        }
      })();
    </script>
  </body>
</html>
